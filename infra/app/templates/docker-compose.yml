services:
  db:
    image: mysql:9.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "{{ mysql_root_password }}"
      MYSQL_DATABASE: "{{ mysql_database }}"
    networks:
      - db-network
    volumes:
      - db_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: "mysql -uroot -p$$MYSQL_ROOT_PASSWORD -e 'SHOW DATABASES;'"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - db-network
      - external-network
    depends_on:
      db:
        condition: service_healthy

  server:
    image: "{{ backend_image }}"
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: "{{ mysql_database }}"
      MYSQL_USER: "{{ mysql_user }}"
      MYSQL_ROOT_PASSWORD: "{{ mysql_root_password }}"
      MYSQL_PASSWORD: "{{ mysql_password }}"
      MYSQL_PORT: "{{ mysql_port }}"
      ADMIN_EMAIL: "{{ admin_email }}"
      ADMIN_PASSWORD: "{{ admin_password }}"
      JWT_SECRET: "{{ jwt_secret }}"
      PORT: "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db-network
      - external-network
    healthcheck:
      test: "curl -f http://localhost:8000/users"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  react:
    image: "{{ frontend_image }}"
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - external-network
    healthcheck:
      test: "curl -f http://localhost:80"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  db_data:

networks:
  db-network:
    internal: true
  external-network:
