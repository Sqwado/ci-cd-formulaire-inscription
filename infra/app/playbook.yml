---
- name: Déploiement application (pull depuis registry privé)
  hosts: app_hosts
  gather_facts: false
  become: true
  vars:
    project_dir: "/home/ubuntu/app-inscription"
    registry_host: "{{ lookup('env', 'REGISTRY_HOST') }}"
    registry_username: "{{ lookup('env', 'REGISTRY_USERNAME') }}"
    registry_password: "{{ lookup('env', 'REGISTRY_PASSWORD') }}"
    image_namespace: "{{ lookup('env', 'IMAGE_NAMESPACE') | default('inscription', true) }}"
    backend_image: "{{ registry_host }}:443/{{ image_namespace }}/backend:latest"
    frontend_image: "{{ registry_host }}:443/{{ image_namespace }}/frontend:latest"
    mysql_root_password: "{{ lookup('env', 'MYSQL_ROOT_PASSWORD') }}"
    mysql_database: "{{ lookup('env', 'MYSQL_DATABASE') }}"
    mysql_user: "{{ lookup('env', 'MYSQL_USER') | default('root', true) }}"
    mysql_password: "{{ lookup('env', 'MYSQL_PASSWORD') if (lookup('env', 'MYSQL_PASSWORD') | default('', true) | length > 0) else lookup('env', 'MYSQL_ROOT_PASSWORD') }}"
    mysql_port: "{{ lookup('env', 'MYSQL_PORT') | default('3306', true) }}"
    admin_email: "{{ lookup('env', 'ADMIN_EMAIL') }}"
    admin_password: "{{ lookup('env', 'ADMIN_PASSWORD') }}"
    jwt_secret: "{{ lookup('env', 'JWT_SECRET') }}"

  tasks:
    - name: Attendre que SSH soit disponible
      wait_for_connection:
        delay: 5
        timeout: 300
        sleep: 5
      tags: [bootstrap, deploy]

    - name: Attendre la fin de cloud-init
      command: cloud-init status --wait
      changed_when: false
      register: cloud_init_wait
      failed_when: cloud_init_wait.rc not in [0, 2]
      tags: [bootstrap, deploy]

    - name: Vérification des variables obligatoires
      assert:
        that:
          - registry_host | length > 0
          - registry_username | length > 0
          - registry_password | length > 0
          - mysql_root_password | length > 0
          - mysql_database | length > 0
          - admin_email | length > 0
          - admin_password | length > 0
          - jwt_secret | length > 0
        fail_msg: "Variables d'environnement manquantes (voir .env.example / GitHub Secrets)."
      tags: [bootstrap, deploy]

    - name: Vérifier si Docker est déjà installé
      command: docker --version
      register: docker_check
      changed_when: false
      failed_when: false
      tags: [bootstrap, deploy]

    - name: Installation des paquets
      apt:
        update_cache: yes
        cache_valid_time: 3600
        name:
          - docker.io
          - docker-compose-v2
          - curl
        state: present
      when: docker_check.rc != 0
      tags: [bootstrap]

    - name: Ajout user au groupe docker
      user:
        name: ubuntu
        groups: docker
        append: yes
      tags: [bootstrap]

    - name: Création des dossiers
      file:
        path: "{{ item }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"
      loop:
        - "{{ project_dir }}"
        - "{{ project_dir }}/db"
      tags: [bootstrap, deploy]

    - name: Configuration Docker daemon (registry insecure HTTPS)
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "insecure-registries": ["{{ registry_host }}:443"]
          }
        mode: "0644"
      notify: Restart docker
      tags: [bootstrap, deploy]

    - name: Appliquer le redémarrage Docker si nécessaire
      meta: flush_handlers
      tags: [bootstrap, deploy]

    - name: Attendre que Docker soit prêt
      wait_for:
        path: /var/run/docker.sock
        state: present
        delay: 2
        timeout: 60
      tags: [bootstrap, deploy]

    - name: Copie des migrations SQL
      copy:
        src: "{{ playbook_dir }}/../../db/"
        dest: "{{ project_dir }}/db/"
        owner: ubuntu
        group: ubuntu
        mode: "0644"
      tags: [deploy]

    - name: Copie du docker-compose.yml
      template:
        src: docker-compose.yml
        dest: "{{ project_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: "0644"
      tags: [deploy]

    - name: Vérifier la connectivité vers le registry
      shell: |
        set -o pipefail
        code=$(curl -ksS -o /dev/null -w "%{http_code}" "https://{{ registry_host }}:443/v2/")
        echo "HTTP ${code}"
        test "${code}" = "401" -o "${code}" = "200"
      args:
        executable: /bin/bash
      register: registry_ping
      changed_when: false
      tags: [deploy]

    - name: Login au registry privé
      environment:
        REGISTRY_PASS: "{{ registry_password }}"
        REGISTRY_USER: "{{ registry_username }}"
        REGISTRY_URL: "{{ registry_host }}:443"
      shell: |
        set -o pipefail
        printf '%s' "${REGISTRY_PASS}" | docker login "${REGISTRY_URL}" -u "${REGISTRY_USER}" --password-stdin
      args:
        executable: /bin/bash
      register: docker_login
      no_log: true
      tags: [deploy]

    - name: Vérifier le login registry
      fail:
        msg: >-
          docker login a échoué (code {{ docker_login.rc }}).
          Vérifiez REGISTRY_USERNAME et REGISTRY_PASSWORD dans GitHub Secrets.
      when: docker_login.rc != 0
      tags: [deploy]

    - name: Pull des images
      command: docker compose pull
      args:
        chdir: "{{ project_dir }}"
      async: 600
      poll: 10
      tags: [deploy]

    - name: Démarrage de la stack
      shell: nohup docker compose up -d --pull never > /tmp/compose-up.log 2>&1 &
      args:
        chdir: "{{ project_dir }}"
        executable: /bin/bash
      changed_when: true
      tags: [deploy]

    - name: Attendre que les conteneurs démarrent
      command: docker compose ps -q
      args:
        chdir: "{{ project_dir }}"
      register: compose_running
      until: compose_running.stdout_lines | length >= 4
      retries: 24
      delay: 5
      changed_when: false
      tags: [deploy]

    - name: Attendre que MySQL soit healthy
      command: docker compose ps db
      args:
        chdir: "{{ project_dir }}"
      register: mysql_ps
      until: "'(healthy)' in mysql_ps.stdout"
      retries: 36
      delay: 5
      changed_when: false
      tags: [deploy]

    - name: Redémarrer le backend (seed admin après MySQL)
      command: docker compose restart server
      args:
        chdir: "{{ project_dir }}"
      tags: [deploy]

    - name: Attendre que le backend réponde
      uri:
        url: "http://localhost:8000/users"
        status_code: 200
      register: backend_health
      until: backend_health.status == 200
      retries: 24
      delay: 5
      tags: [deploy]

    - name: Statut des conteneurs
      command: docker compose ps
      args:
        chdir: "{{ project_dir }}"
      register: compose_ps_output
      changed_when: false
      tags: [deploy]

    - name: Affichage du statut final
      debug:
        msg: "{{ compose_ps_output.stdout_lines }}"
      tags: [deploy]

  handlers:
    - name: Restart docker
      service:
        name: docker
        state: restarted
