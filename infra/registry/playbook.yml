---
- name: Déploiement Registry Sécurisé (HTTPS / Nginx)
  hosts: registry_hosts
  gather_facts: false
  become: true
  vars:
    project_dir: "/home/ubuntu/registry-simple"
    public_ip: "{{ ansible_host }}"
    registry_admin_user: "{{ lookup('env', 'REGISTRY_USERNAME') }}"
    registry_admin_password: "{{ lookup('env', 'REGISTRY_PASSWORD') }}"

  tasks:
    - name: Attendre que SSH soit disponible
      wait_for_connection:
        delay: 5
        timeout: 300
        sleep: 5
      tags: [bootstrap, deploy]

    - name: Attendre la fin de cloud-init
      command: cloud-init status --wait
      changed_when: false
      tags: [bootstrap, deploy]

    - name: Vérification des variables registry
      assert:
        that:
          - registry_admin_user | length > 0
          - registry_admin_password | length > 0
        fail_msg: "REGISTRY_USERNAME et REGISTRY_PASSWORD doivent être définis (GitHub Secrets)."
      tags: [bootstrap, deploy]

    - name: Vérifier si Docker est déjà installé
      command: docker --version
      register: docker_check
      changed_when: false
      failed_when: false
      tags: [bootstrap, deploy]

    - name: Installation des paquets
      apt:
        update_cache: yes
        cache_valid_time: 3600
        name:
          - docker.io
          - docker-compose-v2
          - apache2-utils
          - openssl
        state: present
      when: docker_check.rc != 0
      tags: [bootstrap]

    - name: Ajout user au groupe docker
      user:
        name: ubuntu
        groups: docker
        append: yes
      tags: [bootstrap]

    - name: Création des dossiers
      file:
        path: "{{ item }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"
      loop:
        - "{{ project_dir }}"
        - "{{ project_dir }}/auth"
        - "{{ project_dir }}/data"
        - "{{ project_dir }}/ssl"
        - "{{ project_dir }}/nginx"
      tags: [bootstrap, deploy]

    - name: Génération mot de passe registry
      shell: |
        htpasswd -nbB "{{ registry_admin_user }}" "{{ registry_admin_password }}" \
          > "{{ project_dir }}/auth/registry.password"
      args:
        executable: /bin/bash
      no_log: true
      tags: [bootstrap, deploy]

    - name: Permissions fichier htpasswd
      file:
        path: "{{ project_dir }}/auth/registry.password"
        owner: ubuntu
        group: ubuntu
        mode: "0640"
      tags: [bootstrap, deploy]

    - name: Génération certificat SSL auto-signé
      command: >
        openssl req -x509 -nodes -days 365 -newkey rsa:2048
        -keyout {{ project_dir }}/ssl/registry.key
        -out {{ project_dir }}/ssl/registry.crt
        -subj "/CN={{ public_ip }}"
      args:
        creates: "{{ project_dir }}/ssl/registry.crt"
      tags: [bootstrap]

    - name: Ajustement des permissions du certificat SSL
      file:
        path: "{{ item }}"
        owner: ubuntu
        group: ubuntu
        mode: "0644"
      loop:
        - "{{ project_dir }}/ssl/registry.crt"
        - "{{ project_dir }}/ssl/registry.key"
      tags: [bootstrap]

    - name: Copie de la configuration Nginx
      template:
        src: nginx.conf
        dest: "{{ project_dir }}/nginx/nginx.conf"
        owner: ubuntu
        group: ubuntu
        mode: "0644"
      tags: [deploy]

    - name: Copie du docker-compose.yml
      template:
        src: docker-compose.yml
        dest: "{{ project_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: "0644"
      tags: [deploy]

    - name: Démarrage de la stack
      command: docker compose up -d
      args:
        chdir: "{{ project_dir }}"
      tags: [deploy]

    - name: Récupération du statut des conteneurs
      command: docker compose ps
      args:
        chdir: "{{ project_dir }}"
      register: compose_ps_output
      changed_when: false
      tags: [deploy]

    - name: Affichage du statut final
      debug:
        msg: "{{ compose_ps_output.stdout_lines }}"
      tags: [deploy]
