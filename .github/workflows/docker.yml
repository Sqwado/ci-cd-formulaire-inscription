name: Docker Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docker:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            dockerfile: ./react/DockerfileNodejs
            image: frontend
          - name: backend
            dockerfile: ./server/Dockerfile
            image: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create .env file
        run: |
          cat > .env <<'EOF'
          MYSQL_ROOT_PASSWORD=ci_test_password
          MYSQL_DATABASE=ynov_ci
          MYSQL_USER=root
          EOF

      - name: Start docker compose
        run: docker compose -f docker-compose.yml up -d --build

      - name: Wait and verify all services are healthy
        run: |
          services=(db adminer server react)
          max_attempts=24
          sleep_seconds=5

          for service in "${services[@]}"; do
            container_id=$(docker compose -f docker-compose.yml ps -q "$service")
            echo "Waiting for $service ($container_id)..."

            for attempt in $(seq 1 "$max_attempts"); do
              status=$(docker inspect --format '{{.State.Health.Status}}' "$container_id" 2>/dev/null || echo "starting")
              echo "  attempt $attempt: $status"

              if [ "$status" = "healthy" ]; then
                break
              fi

              if [ "$attempt" -eq "$max_attempts" ]; then
                echo "Service $service did not become healthy in time."
                docker compose -f docker-compose.yml logs "$service"
                exit 1
              fi

              sleep "$sleep_seconds"
            done

            healthy=$(docker inspect --format '{{json .State.Health.Status}}' "$container_id" | jq '. == "healthy"')
            echo "$service healthy: $healthy"

            if [ "$healthy" != "true" ]; then
              docker compose -f docker-compose.yml logs "$service"
              exit 1
            fi
          done
