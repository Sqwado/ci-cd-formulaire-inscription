name: Docker Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docker:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            dockerfile: ./react/DockerfileNodejs
            image: frontend
          - name: backend
            dockerfile: ./server/Dockerfile
            image: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: |
          cat > .env <<'EOF'
          MYSQL_ROOT_PASSWORD=ci_test_password
          MYSQL_DATABASE=ynov_ci
          MYSQL_USER=root
          ADMIN_EMAIL=loise.fenoll@ynov.com
          ADMIN_PASSWORD=PvdrTAzTeR247sDnAZBr
          JWT_SECRET=ci_jwt_secret
          EOF

      - name: Start docker compose
        run: docker compose -f docker-compose.yml up -d --build

      - name: Wait and verify all services are healthy
        run: |
          services=(db adminer server react)
          max_attempts=24
          sleep_seconds=5

          for service in "${services[@]}"; do
            container_id=$(docker compose -f docker-compose.yml ps -q "$service")
            echo "Waiting for $service ($container_id)..."

            for attempt in $(seq 1 "$max_attempts"); do
              status=$(docker inspect --format '{{.State.Health.Status}}' "$container_id" 2>/dev/null || echo "starting")
              echo "  attempt $attempt: $status"

              if [ "$status" = "healthy" ]; then
                break
              fi

              if [ "$attempt" -eq "$max_attempts" ]; then
                echo "Service $service did not become healthy in time."
                docker compose -f docker-compose.yml logs "$service"
                exit 1
              fi

              sleep "$sleep_seconds"
            done

            healthy=$(docker inspect --format '{{json .State.Health.Status}}' "$container_id" | jq '. == "healthy"')
            echo "$service healthy: $healthy"

            if [ "$healthy" != "true" ]; then
              docker compose -f docker-compose.yml logs "$service"
              exit 1
            fi
          done

      - name: Test infra
        run: |
          curl -fsS http://localhost:8000/users | jq -e '.users | type == "array"'
          curl -fsS -X POST http://localhost:8000/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"loise.fenoll@ynov.com","password":"PvdrTAzTeR247sDnAZBr"}' \
            | jq -e '.token | type == "string"'
          curl -fsS -o /dev/null http://localhost:3000/
          curl -fsS -o /dev/null http://localhost:8080/

      - name: Run API unit tests
        run: |
          pip install -r server/requirements.txt pytest httpx
          cd server && python -m pytest test_serveur.py -v

      - name: Ensure node_modules is writable
        run: |
          if [ -d node_modules ] && [ ! -w node_modules ]; then
            sudo rm -rf node_modules
            npm ci
          fi

      - name: Reset database before integration tests
        run: docker compose -f docker-compose.yml exec -T db mysql -uroot -pci_test_password ynov_ci -e "DELETE FROM users;"

      - name: Cypress run (stack Docker)
        uses: cypress-io/github-action@v7
        env:
          PUBLIC_URL: /
        with:
          install: false
          spec: cypress/e2e/docker-integration.cy.js
          wait-on: 'http://localhost:3000'

      - name: Stop react for offline Cypress
        run: docker compose -f docker-compose.yml stop react

      - name: Build offline app
        run: PUBLIC_URL=/ REACT_APP_OFFLINE_MODE=true npm run build

      - name: Cypress run (offline sync)
        uses: cypress-io/github-action@v7
        env:
          PUBLIC_URL: /
        with:
          install: false
          spec: cypress/e2e/offline-sync.cy.js
          start: npx --yes serve -s build -l 3000
          wait-on: 'http://localhost:3000'

      - name: Stop backend
        run: docker compose -f docker-compose.yml stop server

      - name: Cypress run (offline reseau coupe)
        uses: cypress-io/github-action@v7
        env:
          PUBLIC_URL: /
        with:
          install: false
          spec: cypress/e2e/offline-network.cy.js
          start: npx --yes serve -s build -l 3000
          wait-on: 'http://localhost:3000'

      - name: Tear down docker compose
        if: always()
        run: docker compose -f docker-compose.yml down -v
