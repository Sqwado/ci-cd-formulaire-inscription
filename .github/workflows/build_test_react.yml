name: Build, Test and Deploy React Application

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run unit and integration tests
        run: npm test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate docs and build app
        run: |
          npm run jsdoc
          npm run build

      - name: Prepare static server for Cypress
        run: |
          mkdir -p dist-server/ci-cd-formulaire-inscription
          cp -r build/* dist-server/ci-cd-formulaire-inscription/

      - name: Cypress run
        uses: cypress-io/github-action@v6
        env:
          PUBLIC_URL: /ci-cd-formulaire-inscription
        with:
          install: false
          start: npx --yes serve dist-server -l 3000
          wait-on: 'http://localhost:3000/ci-cd-formulaire-inscription'

      - name: Setup Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v3

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  publish-npm:
    needs: [unit-test, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Authenticate with npm
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Build and publish package on NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          git config --global user.email ${{ secrets.USER_EMAIL }}
          git config --global user.name ${{ secrets.USER_NAME }}
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          NPM_VERSION=$(npm view "$PACKAGE_NAME" version 2>/dev/null || echo "")

          echo "Version locale : $LOCAL_VERSION"
          echo "Version NPM    : ${NPM_VERSION:-non publiée}"

          npm run build-npm-ci

          if [ "$LOCAL_VERSION" != "$NPM_VERSION" ]; then
            echo "Nouvelle version détectée, publication sur NPM..."
            npm publish
          else
            echo "La version $LOCAL_VERSION est déjà sur NPM, publication ignorée."
          fi

  deploy:
    needs: [unit-test, e2e, publish-npm]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
